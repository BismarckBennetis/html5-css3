<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>

</head>

<body>
    <h1>Imagens Dinamicas</h1>
        <p>Tente abrir esse site em varios dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
        
        <picture>
            <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
            <source media="(max-width:1050px)" srcset="imagens/foto-m.png" type="image/png">
            <img src="imagens/foto-g.png" alt="Imagen flexivel">
        </picture>

    <h1>Reproduzindo Audio</h1>
        <p>Vamos reproduzir o audio manifesto.</p>
        <!-- <audio src="midia/Todo mundo sabe.mpeg" controls></audio> -->
         
         <audio preload="metadata" controls>
            <source src="midia/Todo mundo sabe.mpeg" type="audio/mpeg">
            <source src="midia/Todo mundo sabe.ogg" type="audio/ogg">
            <source src="midia/Todo mundo sabe.wav" type="audio/wav">
         </audio>

         <audio preload="metadata" controls>
            <source src="midia/E nada e feito.mpeg" type="audio/mpeg">
         </audio>

</body>

</html>
