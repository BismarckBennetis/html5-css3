<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Lovera';
            src: url('fontes/Lovera\ Personal\ Use\ Only.otf') format('opentype') , url('fontes/Airlove\ Ttf\ \(Personal\ Use\).ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /* Tipo de Formatos de Fonte 
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            -truetype-aat (Apple Advanced Typography)
            -svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            
        }

        h1 {
            font-family: 'Lovera', Times, serif;
        }
        
    </style>

</head>

<body>

</body>

</html>
