<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borda Personalizada</title>
        <style>
            body{
                background-color: rgb(108, 108, 240); 
            }

            h1 {
                background: linear-gradient( lightgrey) padding-box,
                            linear-gradient(-45deg, green, black) border-box;
                border: 3px solid transparent;
                border-radius: 20px;

                text-align: center;

                padding: 5px;
                margin: 40px;

            }

            h1#teste {
                box-shadow: 4px 6px 7px 3px rgba(0, 0, 0, 0.404);
            }
        </style>

</head>

<body>
    <h1>Teste de Borda</h1>

    <h1 id="teste">Minha Ideia</h1>
</body>

</html>
