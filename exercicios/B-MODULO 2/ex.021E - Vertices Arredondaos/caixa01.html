<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
        <style>
            h1{
                background-color: lightgrey;
                height: 300px;
                width: 300px;
                border-width: 10px;
                border-style: solid;
                border-color: rgb(70, 67, 67);

                padding-top: 10px;
                padding-right: 10px;
                padding-bottom: 10px;
                padding-left: 10px;

                margin-top: 10px;
                margin-right: 10px;
                margin-bottom: 10px;
                margin-left: 10px;

                outline-width: 5px;
                outline-style: dashed;
                outline-color: green;
                
            }

            a {
                border-width: 4px;
                border-style: solid;
                border-color: red;
                }
        </style>

</head>

<body>
    <h1>Exemplo de Caixa box-level</h1>
        <p>Parágrafos tambem sao exemplos de box-level, mas os <a href="#"> os links são exemplos de caixas inline-level</a>. Vamosver como isso funciona.</p>


</body>

</html>
